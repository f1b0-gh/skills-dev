name: Check skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      SKILLS_DEV_NIGHTLY: nightly-2026-10-29
      SKILLS_DEV_RUNTIME: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Structural checks
        run: python3 scripts/validate.py
      - name: Provision example toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup toolchain install nightly-2026-10-29 --profile minimal
          cargo fetch --locked --manifest-path tests/runtime/Cargo.toml
      - name: Example and validator regressions
        run: python3 -m unittest discover -s tests -v
